<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes dashboard</title>
  <meta name="description" content="A private notes dashboard that runs entirely in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <aside class="side">
      <h1 class="brand">Notes</h1>
      <button id="newBtn" class="btn primary" title="New note (Alt+N)">New note</button>
      <nav id="views" aria-label="Note views"></nav>
      <div class="tags-block">
        <h2>Tags</h2>
        <div id="tagList" class="taglist"></div>
      </div>
      <div class="side-foot">
        <button id="exportBtn" class="btn ghost">Export backup</button>
        <label class="btn ghost" tabindex="0" id="importLabel">Import backup
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
        <button id="themeBtn" class="btn ghost">Theme: auto</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <input id="search" type="search" placeholder="Search notes (Ctrl+K)" aria-label="Search notes" autocomplete="off">
        <select id="sort" aria-label="Sort notes">
          <option value="updated">Recently edited</option>
          <option value="created">Recently created</option>
          <option value="title">Title A–Z</option>
        </select>
      </header>

      <section class="stats" id="stats" aria-label="Summary"></section>

      <section class="activity" aria-label="Writing activity">
        <div class="section-head">
          <h2>Writing activity</h2>
          <span id="heatTotal" class="muted"></span>
        </div>
        <div id="heat" class="heat" role="img" aria-label="Edits per day over the last 16 weeks"></div>
      </section>

      <section>
        <div class="section-head">
          <h2 id="listTitle">All notes</h2>
          <button id="emptyTrash" class="btn ghost small" hidden>Empty trash</button>
        </div>
        <div id="list" class="list"></div>
      </section>
    </main>

    <aside class="editor" id="editor" hidden aria-label="Note editor">
      <div class="ed-bar">
        <button id="eClose" class="btn ghost small">Close</button>
        <span id="eStatus" class="muted" aria-live="polite"></span>
      </div>
      <input id="eTitle" class="ed-title" placeholder="Title" aria-label="Note title" autocomplete="off">
      <textarea id="eBody" class="ed-body" placeholder="Start writing…" aria-label="Note body"></textarea>
      <input id="eTags" class="ed-tags" placeholder="Tags, separated by commas" aria-label="Tags" autocomplete="off">
      <div class="ed-meta">
        <div id="eColors" class="swatches" role="group" aria-label="Note color"></div>
        <span id="eCount" class="muted"></span>
      </div>
      <div class="ed-actions">
        <button id="ePin" class="btn ghost small"></button>
        <button id="eArchive" class="btn ghost small"></button>
        <button id="eTrash" class="btn ghost small"></button>
        <button id="eDelete" class="btn danger small" hidden>Delete forever</button>
      </div>
    </aside>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
